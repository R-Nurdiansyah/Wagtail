# Configuration file for Snakemake pipeline

# #configurable parameters by user

#run_name for the pipeline
run_name: ""

#put your list of filenames file here, make sure it is one column with no header and just the accession number
sample_list: ""

#put your file map file here make sure it is two column with no header and just the accession number and absolute path to the file
file_map: ""

# Amplicon type (optional).
# Leave commented out (or set to "all") to auto-detect per sample using
# marker_id (recommended for mixed runs).
# Set to a specific marker to force the entire run to one amplicon type
# Accepted values: 16S | 18S | ITS | CO1 | all
#amplicon: "all"